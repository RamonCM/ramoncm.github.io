# Menu do topo do site.
#
# "main" e o menu das paginas em ingles; "main_pt" e o menu das paginas em
# portugues. O arquivo _includes/masthead.html escolhe qual lista mostrar
# a partir do campo `lang` da pagina.
#
# Para adicionar uma aba nova (ex.: Science Communication / Portfolio),
# descomente as linhas abaixo e crie as duas paginas correspondentes em
# _pages/ e _pages/pt/ (cada uma apontando para a outra em `translation`).

main:
